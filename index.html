<!DOCTYPE html>
<html lang="ru">
<head>

  <title>Мой Сайт</title>
  <link rel="stylesheet" href="style.css">
</head>

      <h3>Красивый дизайн</h3>
      <p>Современные стили и плавные анимации.</p>
    </div>
    <div class="card">
      <span class="icon">⚡</span>
      <h3>Быстрый</h3>
      <p>Лёгкий и оптимизированный код.</p>
    </div>
    <div class="card">
      <span class="icon">📱</span>
      <h3>Адаптивный</h3>
      <p>Отлично выглядит на любом устройстве.</p>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>© 2024 Мой Сайт. Сделано с ❤️</p>
    </div>
  </footer>

  <script src="script.js"></script>
